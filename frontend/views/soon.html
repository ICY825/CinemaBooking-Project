<section class="card empty-state" ng-if="vm.feature">
  <h1>{{vm.feature.title}}</h1>
  <p class="muted">Chức năng này đang được phát triển theo master plan.</p>
  <dl class="info">
    <dt>Task</dt><dd>{{vm.feature.task}}</dd>
    <dt>Dự kiến</dt><dd>{{vm.feature.when}}</dd>
  </dl>
</section>
<section class="card empty-state" ng-if="!vm.feature">
  <h1>Không tìm thấy trang</h1>
  <a class="btn btn-ghost" href="#!/">Về trang chủ</a>
</section>
