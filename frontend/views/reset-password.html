<section class="auth-card">
  <h1>Đặt lại mật khẩu</h1>

  <div class="alert alert-error" ng-if="!vm.token">
    Liên kết không hợp lệ. Hãy mở đúng liên kết trong email, hoặc <a href="#!/forgot-password">yêu cầu liên kết mới</a>.
  </div>

  <div ng-if="vm.token">
    <div class="alert alert-error" ng-if="vm.error">{{vm.error}}</div>
    <form name="resetForm" ng-submit="resetForm.$valid && vm.submit()" novalidate>
      <label>Mật khẩu mới
        <input type="password" ng-model="vm.form.password" required ng-minlength="8" autocomplete="new-password" />
        <small class="hint">Ít nhất 8 ký tự, gồm cả chữ và số.</small>
      </label>
      <label>Nhập lại mật khẩu mới
        <input type="password" ng-model="vm.form.confirm" required autocomplete="new-password" />
      </label>
      <button class="btn btn-primary btn-block" type="submit" ng-disabled="resetForm.$invalid || vm.loading">
        {{vm.loading ? 'Đang lưu...' : 'Đặt lại mật khẩu'}}
      </button>
    </form>
  </div>
</section>
