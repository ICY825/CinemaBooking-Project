<section class="auth-card">
  <h1>Tạo tài khoản</h1>
  <p class="muted">Dành cho khách hàng đặt vé online.</p>

  <div class="alert alert-error" ng-if="vm.error">{{vm.error}}</div>

  <form name="registerForm" ng-submit="registerForm.$valid && vm.submit()" novalidate>
    <label>Họ tên
      <input type="text" ng-model="vm.form.full_name" required ng-minlength="2" maxlength="120" autocomplete="name" />
    </label>
    <label>Email
      <input type="email" ng-model="vm.form.email" required autocomplete="email" />
    </label>
    <label>Số điện thoại <span class="muted">(không bắt buộc)</span>
      <input type="tel" ng-model="vm.form.phone" ng-pattern="/^\+?\d{9,15}$/" autocomplete="tel" />
    </label>
    <label>Mật khẩu
      <input type="password" ng-model="vm.form.password" required ng-minlength="8" autocomplete="new-password" />
      <small class="hint">Ít nhất 8 ký tự, gồm cả chữ và số.</small>
    </label>
    <label>Nhập lại mật khẩu
      <input type="password" ng-model="vm.form.confirm" required autocomplete="new-password" />
    </label>
    <button class="btn btn-primary btn-block" type="submit" ng-disabled="registerForm.$invalid || vm.loading">
      {{vm.loading ? 'Đang tạo...' : 'Đăng ký'}}
    </button>
  </form>

  <p class="links"><span>Đã có tài khoản? <a href="#!/login">Đăng nhập</a></span></p>
</section>
