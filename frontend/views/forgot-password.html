<section class="auth-card">
  <h1>Quên mật khẩu</h1>

  <div ng-if="!vm.sent">
    <p class="muted">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>
    <div class="alert alert-error" ng-if="vm.error">{{vm.error}}</div>
    <form name="forgotForm" ng-submit="forgotForm.$valid && vm.submit()" novalidate>
      <label>Email
        <input type="email" ng-model="vm.form.email" required autofocus />
      </label>
      <button class="btn btn-primary btn-block" type="submit" ng-disabled="forgotForm.$invalid || vm.loading">
        {{vm.loading ? 'Đang gửi...' : 'Gửi liên kết'}}
      </button>
    </form>
  </div>

  <div ng-if="vm.sent">
    <div class="alert alert-success">{{vm.sent}}.</div>
    <p class="muted">
      Môi trường dev: email được gửi tới MailHog, mở
      <a ng-href="{{vm.mailhogUrl}}" target="_blank" rel="noopener">{{vm.mailhogUrl}}</a> để lấy liên kết.
      Liên kết có hiệu lực 30 phút và chỉ dùng được một lần.
    </p>
  </div>

  <p class="links"><a href="#!/login">Quay lại đăng nhập</a></p>
</section>
